# Backend deploy — build, push to ECR, and PROVE the pushed artifact is live.
#
# ---------------------------------------------------------------------------
# Why the verification below is shaped the way it is
# ---------------------------------------------------------------------------
# App Runner's ECR auto-deploy is asynchronous, and the service is already
# `RUNNING` before we push anything. So the two obvious checks are both
# vacuous:
#
#   * polling `DescribeService` for `Status == RUNNING` observes the OLD
#     service and passes immediately, before the new revision exists;
#   * an identical image digest fires no deployment at all — and that same poll
#     still passes, reporting success for a deploy that never happened.
#
# Instead: snapshot the deployment operations BEFORE the push, poll
# `ListOperations` for one that is not in that snapshot, wait for it to reach
# SUCCEEDED, and only then assert that `GET /api/health` reports the exact
# commit this run built. Nothing short of that last assertion distinguishes
# "a deployment succeeded" from "the code I pushed is serving traffic".
#
# ---------------------------------------------------------------------------
# Why there is a human in the loop
# ---------------------------------------------------------------------------
# `src/index.ts` runs `drizzle/` migrations on container boot. An automatic
# backend deploy therefore applies schema changes to production Aurora with no
# gate and no way back once data is written under the new schema. The `deploy`
# job runs through a GitHub Environment with a REQUIRED REVIEWER: automatic to
# the door, human through it. The `Verify the environment gate` step below
# fails closed if that protection is missing, because an Environment that does
# not exist is created silently and unprotected on first use.
#
# The reviewer is READ, not assumed. When this workflow first shipped the
# environment had no required reviewer (required reviewers on a private repo
# in a Free organisation answered 422 from the API), and every deploy stopped
# at that first step — the correct outcome. A reviewer has since been added,
# but nothing here pins that: the gate step reads the environment's protection
# rules on every run, so if the reviewer is ever removed the deploy refuses
# again rather than silently applying migrations unattended. To check by hand:
#
#   gh api repos/portofino-pizzeria/backend/environments/production-backend \
#     --jq '[.protection_rules[].type]'          # must contain "required_reviewers"
#
# The rule became configurable because the repository was made PUBLIC on
# 2026-09-11 — required reviewers are available on Free for public repos and
# not for private ones. A listed rule is only evidence on a plan that enforces
# it, and whether GitHub keeps LISTING an unenforced rule after a flip back to
# private is not knowable from the rules read alone. So the gate step also
# reads the repository's visibility and refuses on anything but public.
#
# ---------------------------------------------------------------------------
# Rollback: retag when the image already exists, rebuild only when it does not
# ---------------------------------------------------------------------------
# Every deploy pushes a `:<sha>` tag beside `:latest` — one that nothing
# re-points except an explicit `rebuild: true` dispatch (the repository's tags
# are MUTABLE; the workflow, not ECR, is what keeps it still). A
# `workflow_dispatch` naming an older sha therefore usually names an image that
# is ALREADY in ECR, built at that commit with COMMIT_SHA baked in. For that
# case the deploy RETAGS it (`ecr:BatchGetImage` the `:<sha>` manifest,
# `ecr:PutImage` it as `:latest`) instead of rebuilding: it is faster, it
# ships byte-for-byte the artifact that was known good (the manifest is
# re-hashed here and must equal ECR's own digest for it), and it does not
# need `docker build` to succeed at that sha — a removed base-image tag or a
# registry outage cannot block it. What it does NOT skip is CI: the `test`
# job still runs at the target commit before the gate, so a rollback to a
# commit whose `npm ci` or tests no longer pass is refused there, retag or
# not. Skipping that gate would be a separate decision this file does not
# make. `ecr:BatchGetImage` is in the infra role's push statement for this
# retag alone (infra/github-oidc.tf, statement EcrPushBackendImage).
#
# When no `:<sha>` image exists — a fresh master push, or a rollback to a
# commit that predates this pipeline — the workflow builds one, as does a
# dispatch with `rebuild: true`. Either way the verification below is
# identical: a retag is a push of `:latest` as far as ECR's event stream and
# App Runner's auto-deploy are concerned, and the health assertion proves the
# same thing about the same field.
#
# One consequence worth knowing: re-dispatching the sha that `:latest` ALREADY
# names is now a no-op rather than a fresh build with a fresh digest. That
# used to be a way to make App Runner redeploy unchanged code; the retag step
# now checks `/api/health` in that case and fails fast, naming `rebuild: true`
# as the lever, instead of waiting fifteen minutes for a deployment that an
# unchanged tag will never start.
#
# A rollback across a migration is NOT a rollback (the old code runs against
# the new schema) and must be treated as a forward fix. Nothing here can tell
# the difference, so that judgement stays with the reviewer at the gate.
#
# ---------------------------------------------------------------------------
# Configuration (repository Settings -> Secrets and variables -> Actions ->
# Variables). None of these are hardcoded here: the role ARN and the service
# ARN both embed the AWS account id, and a workflow copy of an infrastructure
# value is a silent drift channel.
#
#   AWS_ROLE_ARN           (required)  arn:aws:iam::<acct>:role/portofino-ci-backend
#   APPRUNNER_SERVICE_ARN  (required)  arn:aws:apprunner:<region>:<acct>:service/portofino-production-api/<id>
#   AWS_REGION             (optional)  defaults to eu-central-1
#   ECR_REPOSITORY         (optional)  defaults to portofino-production-backend
#   PUBLIC_API_URL         (optional)  https://api.<domain>; when set, a verified
#                                      deploy also checks the custom domain —
#                                      non-gating, see the last step
#
# `APPRUNNER_SERVICE_ARN` is a variable rather than something looked up by
# name because the `portofino-ci-backend` role is granted `DescribeService` and
# `ListOperations` only — deliberately not `ListServices` — and both of those
# take a service ARN. The service id inside the ARN is not derivable.
# ---------------------------------------------------------------------------

name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit to deploy. Leave empty to deploy the tip of the branch this
          run was started from. Set it to roll back — re-running a workflow
          replays the same commit, so a re-run is not a rollback.
        required: false
        type: string
      rebuild:
        description: >-
          Build the image from source even if ECR already holds one tagged
          with this commit. The only way to give App Runner a NEW digest for
          a sha it is already serving (or failed to serve).
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  # NOT cancel-in-progress. Cancelling mid-flight would abandon a deployment
  # App Runner is already applying — including its migrations — with nothing
  # left watching it.
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Which commit are we shipping? Resolved once, so the tests, the image tag and
  # the health assertion can never disagree about it.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Narrower than the workflow default: this job has no business holding an
    # OIDC token it never exchanges.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a dispatch may name an older commit, and a shallow
          # clone would not contain it.
          fetch-depth: 0

      - id: pick
        env:
          # Via env, never interpolated into the script body — a workflow input
          # is attacker-shaped text even on a private repo.
          REQUESTED_SHA: ${{ inputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_SHA}" ]; then
            sha="${DEFAULT_SHA}"
          else
            # Charset-restricted before it reaches git: quoting stops shell
            # injection but not a value beginning with "-", which git would
            # read as an option rather than as a revision.
            case "${REQUESTED_SHA}" in
              -*|*[!A-Za-z0-9._/-]*)
                echo "::error::'${REQUESTED_SHA}' is not a plausible commit, tag or branch."
                exit 1
                ;;
            esac
            if ! sha="$(git rev-parse --verify --quiet "${REQUESTED_SHA}^{commit}")"; then
              echo "::error::'${REQUESTED_SHA}' is not a commit in this repository."
              exit 1
            fi
          fi

          # `fetch-depth: 0` fetches every ref, so the revision above may resolve
          # to the tip of an open PR branch that no one has reviewed. Migrations
          # run on container boot against production Aurora, so a dispatch must
          # not be a route around review: only history that is already on master
          # may be deployed. A rollback target is an ancestor of master, so this
          # constrains nothing legitimate.
          git fetch --no-tags --quiet origin master
          if ! git merge-base --is-ancestor "${sha}" origin/master; then
            echo "::error::${sha} is not an ancestor of origin/master."
            echo "::error::Refusing to deploy a commit that has not landed on master — it would"
            echo "::error::apply its drizzle/ migrations to production Aurora unreviewed."
            exit 1
          fi
          echo "Deploying commit ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The gate. Reuses ci.yml rather than restating it, and passes the resolved
  # commit so a rollback dispatch tests the CODE being rolled back to.
  #
  # Note the asymmetry: a local `uses: ./…` resolves the WORKFLOW FILE at this
  # run's own commit (master's tip), while `ref:` decides only which code is
  # checked out. So a rollback to a commit predating a CI change is tested by
  # today's CI, which can fail for reasons that have nothing to do with that
  # commit.
  # ---------------------------------------------------------------------------
  test:
    name: CI
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: Build, push, verify
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The only job that exchanges an OIDC token for AWS credentials.
    permissions:
      id-token: write
      contents: read
      # For the environment-protection read below. An explicit `permissions:`
      # block sets every unlisted scope to `none`, and there is no workflow
      # `permissions:` key named for the Environments API, so grant the two
      # adjacent read scopes rather than discover at deploy time that the gate
      # check cannot see its own gate.
      actions: read
      deployments: read

    # The required-reviewer gate. See the header. If this Environment does not
    # exist, GitHub creates it unprotected on first use — which is exactly what
    # `Verify the environment gate` refuses to let pass.
    environment:
      name: production-backend
      url: ${{ steps.verify.outputs.health_url }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'portofino-production-backend' }}
      SERVICE_ARN: ${{ vars.APPRUNNER_SERVICE_ARN }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}

    steps:
      - name: Verify the environment gate
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: production-backend
        run: |
          set -euo pipefail

          # Fails closed on BOTH arms: no required reviewer, and "could not
          # tell". This job applies database migrations to production; an
          # unverifiable gate is not a passing one. It runs first, so a
          # misconfiguration costs a red run and nothing else.
          if ! rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME}" \
                          --jq '[.protection_rules[].type] | join(",")' 2>&1)"; then
            echo "::error::Cannot read the protection rules of environment '${ENVIRONMENT_NAME}'."
            echo "::error::That is UNKNOWN, not 'protected'. Refusing to deploy."
            echo "::error::Response: ${rules}"
            # 403 and 404 look alike here and have completely different fixes,
            # so name them rather than leaving the reader to guess.
            case "${rules}" in
              *403*|*"not accessible"*)
                echo "::error::403 — GITHUB_TOKEN cannot read this repository's environments."
                echo "::error::Fix the job's permissions, or supply a fine-grained PAT with"
                echo "::error::Environments:read as a secret. This is NOT a missing environment."
                ;;
              *404*|*"Not Found"*)
                echo "::error::404 — environment '${ENVIRONMENT_NAME}' does not exist. Create it"
                echo "::error::under Settings -> Environments and add a required reviewer."
                ;;
            esac
            exit 1
          fi

          echo "Protection rules on '${ENVIRONMENT_NAME}': ${rules:-<none>}"

          # A listed rule is only evidence on a plan that enforces it. Required
          # reviewers on a PRIVATE repository need Team/Enterprise, and this
          # organisation is on Free — so on a private repository the rule above
          # is either impossible to have configured or of unverifiable effect.
          # Either way that is UNKNOWN, and UNKNOWN does not deploy migrations.
          # `metadata: read` is on every GITHUB_TOKEN, so this read needs no
          # extra permission.
          if ! private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private' 2>&1)"; then
            echo "::error::Cannot read this repository's visibility: ${private}"
            echo "::error::That is UNKNOWN, not 'public'. Refusing to deploy."
            exit 1
          fi
          if [ "${private}" != "false" ]; then
            echo "::error::This repository is PRIVATE (or its visibility read as '${private}')."
            echo "::error::Required reviewers on a private repository need a GitHub Team/Enterprise"
            echo "::error::plan; portofino-pizzeria is on Free, and the reviewer became configurable"
            echo "::error::by making the repository public on 2026-09-11 (see the header). Make it"
            echo "::error::public again, or upgrade the plan and remove this visibility check."
            exit 1
          fi

          case ",${rules}," in
            *,required_reviewers,*) ;;
            *)
              echo "::error::Environment '${ENVIRONMENT_NAME}' has no required reviewer."
              echo "::error::Backend deploys run drizzle/ migrations against production Aurora on"
              echo "::error::container boot, so an unattended deploy applies an irreversible schema"
              echo "::error::change. Add a required reviewer under Settings -> Environments ->"
              echo "::error::${ENVIRONMENT_NAME}. One was configured on 2026-09-11; if it is gone,"
              echo "::error::it was removed. Check with:"
              echo "::error::gh api repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME} --jq '[.protection_rules[].type]'"
              exit 1
              ;;
          esac

      - name: Check the deployment configuration is present
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Repository variable AWS_ROLE_ARN is not set (the portofino-ci-backend role)."
            missing=1
          fi
          if [ -z "${SERVICE_ARN}" ]; then
            echo "::error::Repository variable APPRUNNER_SERVICE_ARN is not set."
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Assume the CI role (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-backend-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------------------
      # Retag or rebuild? Decided by asking ECR whether an image tagged with
      # this exact commit already exists. See the header for why.
      # ---------------------------------------------------------------------
      - name: Look for an image already built at this commit
        id: existing
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          echo "REPO=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

          if [ "${FORCE_REBUILD}" = "true" ]; then
            echo "rebuild=true: building from source without asking ECR."
            echo "strategy=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One call answers both questions: is `:<sha>` there, and is `:latest`
          # already that same image. A MISSING tag is not an error to this API —
          # it lands in `.failures` with code ImageNotFound — so a non-zero exit
          # here is a real failure (denied, throttled, no such repository) and
          # `set -e` lets it fail the job rather than be read as "not built yet".
          out="$(aws ecr batch-get-image \
                   --repository-name "${ECR_REPOSITORY}" \
                   --image-ids "imageTag=${TARGET_SHA}" "imageTag=latest" \
                   --output json)"

          sha_digest="$(jq -r --arg t "${TARGET_SHA}" \
            '.images[]? | select(.imageId.imageTag == $t) | .imageId.imageDigest' <<<"${out}")"
          latest_digest="$(jq -r \
            '.images[]? | select(.imageId.imageTag == "latest") | .imageId.imageDigest' <<<"${out}")"

          if [ -z "${sha_digest}" ]; then
            code="$(jq -r --arg t "${TARGET_SHA}" \
              '.failures[]? | select(.imageId.imageTag == $t) | .failureCode' <<<"${out}")"
            if [ "${code}" != "ImageNotFound" ]; then
              echo "::error::ECR could not say whether ${ECR_REPOSITORY}:${TARGET_SHA} exists"
              echo "::error::(failure code '${code:-<none>}'). That is UNKNOWN, not 'not built';"
              echo "::error::refusing to guess. Response: ${out}"
              exit 1
            fi
            echo "No image tagged ${TARGET_SHA} in ${ECR_REPOSITORY}: building one."
            echo "strategy=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep the manifest BYTE-verbatim. ECR's digest is sha256 of exactly
          # these bytes, and PutImage stores what it is given: `jq -j`, because
          # `-r` would append a newline, and one extra byte is a different
          # digest — the retagged :latest would then never compare equal to
          # :<sha>, the already-latest guard below would never fire, and a
          # second identical rollback would end in ImageAlreadyExistsException.
          # So the file is re-hashed and checked against ECR's own digest before
          # anything is pushed: an assertion, not a review-time argument.
          jq -j --arg t "${TARGET_SHA}" \
            '.images[]? | select(.imageId.imageTag == $t) | .imageManifest' <<<"${out}" \
            > "${RUNNER_TEMP}/manifest.json"
          file_digest="sha256:$(sha256sum "${RUNNER_TEMP}/manifest.json" | cut -c1-64)"
          if [ "${file_digest}" != "${sha_digest}" ]; then
            echo "::error::The manifest written for ${ECR_REPOSITORY}:${TARGET_SHA} hashes to"
            echo "::error::${file_digest}, but ECR reports ${sha_digest}. Retagging it would"
            echo "::error::create a different image. Refusing."
            exit 1
          fi
          # Media type carried along too: :latest today is an OCI image index
          # (buildx provenance). ECR can infer it from the manifest body, but
          # stating it costs nothing and removes one inference from the path.
          media_type="$(jq -r --arg t "${TARGET_SHA}" \
            '.images[]? | select(.imageId.imageTag == $t) | .imageManifestMediaType' <<<"${out}")"

          echo "Found ${ECR_REPOSITORY}:${TARGET_SHA} (${sha_digest}): retagging, not rebuilding."
          echo "strategy=retag" >> "$GITHUB_OUTPUT"
          echo "media_type=${media_type}" >> "$GITHUB_OUTPUT"
          if [ "${latest_digest}" = "${sha_digest}" ]; then
            echo ":latest already points at that digest."
            echo "already_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        if: steps.existing.outputs.strategy == 'build'
        run: |
          set -euo pipefail
          # COMMIT_SHA is baked in (Dockerfile ARG -> ENV) and surfaces on
          # /api/health. It is also what makes each commit produce a distinct
          # image digest, which is what makes App Runner's auto-deploy fire.
          docker build \
            --build-arg "COMMIT_SHA=${TARGET_SHA}" \
            -t "${REPO}:${TARGET_SHA}" \
            -t "${REPO}:latest" \
            .

      # ---------------------------------------------------------------------
      # Snapshot IMMEDIATELY BEFORE the push, not before the build. This is the
      # whole basis of the verification: "an operation that was not here a
      # moment ago" is clock-free, so it survives skew between the runner and
      # AWS, and it cannot be satisfied by a deployment that predates this run.
      # Taking it before the build would leave the build's whole duration as a
      # window in which someone else's deployment could be mistaken for ours.
      # ---------------------------------------------------------------------
      - name: Snapshot the App Runner operations that already exist
        run: |
          set -euo pipefail
          aws apprunner list-operations \
            --service-arn "${SERVICE_ARN}" --max-results 20 \
            --query "OperationSummaryList[?Type=='START_DEPLOYMENT'||Type=='UPDATE_SERVICE'].Id" \
            --output text \
            | tr '\t' '\n' | sed '/^$/d' | sort > "${RUNNER_TEMP}/ops-before.txt"
          echo "Operations before push:"
          cat "${RUNNER_TEMP}/ops-before.txt" || true

      - name: Push :<sha>, then :latest
        if: steps.existing.outputs.strategy == 'build'
        run: |
          set -euo pipefail
          # Order matters. Pushing `:latest` is what App Runner watches, so the
          # `:<sha>` tag goes first — a rollback target must exist even if the
          # deployment that follows fails. (On a `rebuild: true` dispatch this
          # re-points an existing `:<sha>` at the fresh digest; the previous
          # manifest for that commit is then untagged.)
          docker push "${REPO}:${TARGET_SHA}"
          docker push "${REPO}:latest"

      - name: Retag :<sha> as :latest
        if: steps.existing.outputs.strategy == 'retag'
        env:
          ALREADY_LATEST: ${{ steps.existing.outputs.already_latest }}
          MEDIA_TYPE: ${{ steps.existing.outputs.media_type }}
        run: |
          set -euo pipefail
          if [ "${ALREADY_LATEST}" = "true" ]; then
            # PutImage of a tag onto the manifest it already names is
            # ImageAlreadyExistsException, not a no-op — and there is nothing
            # to push anyway. App Runner fires no deployment for an unchanged
            # tag, so the only question is whether the service is serving this
            # image already. Ask now rather than let the verify step wait out
            # its fifteen-minute budget to reach the same answer.
            host="$(aws apprunner describe-service --service-arn "${SERVICE_ARN}" \
                      --query 'Service.ServiceUrl' --output text)"
            # Three answers, kept apart because their fixes differ: the commit
            # we want, some other commit (or an image built without the build
            # arg, which reports no field at all), or no answer from the host.
            if body="$(curl -fsS --max-time 15 "https://${host}/api/health" 2>/dev/null)"; then
              current="$(jq -r '.commit // "<no commit field>"' <<<"${body}" 2>/dev/null || echo '<not JSON>')"
            else
              current='<unreachable>'
            fi
            if [ "${current}" = "${TARGET_SHA}" ]; then
              echo ":latest is already ${TARGET_SHA} and the service is serving it; nothing to retag."
              echo "(The verify step will confirm the same thing through its no-op arm.)"
              exit 0
            fi
            if [ "${current}" = "<unreachable>" ]; then
              # UNKNOWN, not "not serving": the host may be mid-incident, and
              # pushing a fresh digest at it now would add a deployment to
              # whatever is already wrong.
              echo "::error::The :latest tag already names the ${TARGET_SHA} image, and"
              echo "::error::https://${host}/api/health did not answer. Whether the service is"
              echo "::error::serving it is UNKNOWN. Check the App Runner console before"
              echo "::error::dispatching anything else."
              exit 1
            fi
            echo "::error::The :latest tag already names the ${TARGET_SHA} image, but /api/health"
            echo "::error::reports commit '${current}'. An unchanged tag starts no App Runner"
            echo "::error::deployment, so retagging cannot fix this. Re-run this workflow with"
            echo "::error::rebuild: true to push a fresh digest for the same commit, or start a"
            echo "::error::deployment from the App Runner console."
            exit 1
          fi
          # A PutImage on `:latest` is a push of that tag to ECR's event stream,
          # which is what App Runner's auto-deploy watches — the same trigger a
          # `docker push` ends with.
          aws ecr put-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-tag latest \
            --image-manifest "file://${RUNNER_TEMP}/manifest.json" \
            --image-manifest-media-type "${MEDIA_TYPE}" \
            --query 'image.imageId' --output json
          echo "Retagged ${ECR_REPOSITORY}:${TARGET_SHA} as :latest."

      # ---------------------------------------------------------------------
      # Verify by operation, then by artifact. Neither alone is enough.
      # ---------------------------------------------------------------------
      - name: Wait for the deployment and assert the live commit
        id: verify
        env:
          STRATEGY: >-
            ${{ steps.existing.outputs.strategy == 'retag'
                && 'retagged the existing :<sha> image'
                || 'built and pushed' }}
        run: |
          set -euo pipefail

          host="$(aws apprunner describe-service --service-arn "${SERVICE_ARN}" \
                    --query 'Service.ServiceUrl' --output text)"
          health_url="https://${host}/api/health"
          echo "health_url=${health_url}" >> "$GITHUB_OUTPUT"
          echo "Health endpoint: ${health_url}"

          live_commit() {
            curl -fsS --max-time 15 "${health_url}" 2>/dev/null | jq -r '.commit // ""' 2>/dev/null || true
          }

          # Returns the deployment operations that were not in the pre-push
          # snapshot, or exits non-zero if AWS could not be asked.
          #
          # The `|| true` belongs to the grep ALONE, and the aws call is checked
          # on its own. Wrapping the whole pipeline in `|| true` would make a
          # throttled or errored ListOperations indistinguishable from "no new
          # operation yet" — the caller would wait out its full timeout and then
          # blame auto-deploy for an AWS-side failure.
          # NOT sorted: ListOperations returns newest-first, and `sort` would
          # replace that with lexicographic UUID order — so with two unseen
          # operations we could follow the older one. `grep -f` does not require
          # its pattern file to be sorted, so the snapshot's own ordering is
          # irrelevant.
          new_ops() {
            local raw
            raw="$(aws apprunner list-operations \
                     --service-arn "${SERVICE_ARN}" --max-results 20 \
                     --query "OperationSummaryList[?Type=='START_DEPLOYMENT'||Type=='UPDATE_SERVICE'].Id" \
                     --output text)" || return 1
            printf '%s\n' "${raw}" | tr '\t' '\n' | sed '/^$/d' \
              | grep -F -x -v -f "${RUNNER_TEMP}/ops-before.txt" || true
          }

          no_op_summary() {
            echo "No deployment was triggered: ${TARGET_SHA} is already live (identical image digest)."
            {
              echo "### Backend deploy — no-op"
              echo ""
              echo "\`${TARGET_SHA}\` was already the running image, so App Runner started no"
              echo "deployment. Verified live via \`${health_url}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # --- 1. An operation that started after our push ---------------------
          #
          # 15 minutes, not 5. ECR-push -> App Runner auto-deploy is event-driven
          # and its latency is not contractual; a 5-minute budget turns an
          # ordinary lag into a red run that blames auto_deployments_enabled
          # while a migration-bearing deploy proceeds unwatched. The budget for
          # the operation to COMPLETE (below) was never the tight one.
          op_id=""
          for i in $(seq 1 90); do
            if ! candidates="$(new_ops)"; then
              echo "::error::aws apprunner list-operations failed while waiting for the"
              echo "::error::deployment to start. The push already happened, so the deploy may"
              echo "::error::well be in flight — this is UNKNOWN, not a failed deployment."
              exit 1
            fi
            # First line = newest operation. No `head`, so no SIGPIPE to reason
            # about under `set -o pipefail`.
            op_id="${candidates%%$'\n'*}"
            [ -n "${op_id}" ] && break

            # The identical-digest no-op resolves early rather than serving out
            # the full 15 minutes: if nothing has fired after ~2 minutes AND the
            # service already reports this exact commit, there is nothing to wait
            # for. A real deploy still reports the OLD commit here, so this
            # cannot short-circuit one.
            if [ "${i}" -ge 12 ] && [ "$(live_commit)" = "${TARGET_SHA}" ]; then
              no_op_summary
              exit 0
            fi
            sleep 10
          done

          if [ -z "${op_id}" ]; then
            current="$(live_commit)"
            if [ "${current}" = "${TARGET_SHA}" ]; then
              no_op_summary
              exit 0
            fi
            echo "::error::No App Runner deployment started within 15 minutes of pushing :latest,"
            echo "::error::and /api/health reports commit '${current:-<unreachable>}', not '${TARGET_SHA}'."
            echo "::error::This is UNKNOWN, not a failed deployment: the image IS pushed, so a"
            echo "::error::deployment may still start after this run ends. Check the App Runner"
            echo "::error::console, and check auto_deployments_enabled is still true."
            exit 1
          fi

          echo "App Runner operation carrying this deploy: ${op_id}"

          # --- 2. That operation has to actually succeed -----------------------
          status=""
          api_failures=0
          for _ in $(seq 1 120); do         # up to 20 minutes
            # A single throttle or 5xx during a 20-minute wait must not abandon a
            # deployment that is still applying migrations — but a PERSISTENT
            # failure must still end the loop rather than run to the job timeout
            # (a timed-out job is cancelled, and `failure()` is false for that).
            if ! status="$(aws apprunner list-operations \
                             --service-arn "${SERVICE_ARN}" --max-results 20 \
                             --query "OperationSummaryList[?Id=='${op_id}'].Status" \
                             --output text)"; then
              api_failures=$((api_failures + 1))
              if [ "${api_failures}" -ge 5 ]; then
                echo "::error::aws apprunner list-operations failed ${api_failures} times in a row"
                echo "::error::while polling operation ${op_id}. Its outcome is UNKNOWN — the"
                echo "::error::deployment may still be running. Check the App Runner console."
                exit 1
              fi
              echo "  (ListOperations failed; retry ${api_failures}/5)"
              sleep 10
              continue
            fi
            api_failures=0
            echo "  operation ${op_id}: ${status:-<not in the last 20 operations>}"
            case "${status}" in
              SUCCEEDED) break ;;
              PENDING|IN_PROGRESS|ROLLBACK_IN_PROGRESS) sleep 10 ;;
              ""|None)
                # ("None" because `--output text` renders an empty/null query
                # result that way on some CLI versions.)
                # ListOperations caps at 20 results, so enough newer operations
                # would push ours off the page. Distinguished from a terminal
                # status because the fix is different: this one means we lost
                # sight of the deployment, not that it failed.
                echo "::error::Operation ${op_id} is no longer among the 20 most recent"
                echo "::error::operations on this service. Its outcome is UNKNOWN — check the"
                echo "::error::App Runner console before assuming either way."
                exit 1
                ;;
              *) echo "::error::Operation ${op_id} ended as ${status}."; exit 1 ;;
            esac
          done
          if [ "${status}" != "SUCCEEDED" ]; then
            echo "::error::Operation ${op_id} did not finish within 20 minutes (last status: ${status})."
            exit 1
          fi

          # --- 3. The artifact serving traffic is the one we built -------------
          # A succeeded operation says a deployment happened. Only this says it
          # deployed OUR commit.
          current=""
          for _ in $(seq 1 20); do          # up to ~2 minutes of edge settling
            current="$(live_commit)"
            [ "${current}" = "${TARGET_SHA}" ] && break
            sleep 6
          done

          if [ "${current}" != "${TARGET_SHA}" ]; then
            echo "::error::Deployment ${op_id} succeeded, but ${health_url} reports"
            echo "::error::commit '${current:-<unreachable>}' instead of '${TARGET_SHA}'."
            if [ "${current}" = "unknown" ]; then
              echo "::error::'unknown' means the image was built without --build-arg COMMIT_SHA."
            fi
            exit 1
          fi

          echo "Verified: ${TARGET_SHA} is live."
          {
            echo "### Backend deploy — verified"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${TARGET_SHA}\` |"
            echo "| Image | ${STRATEGY} |"
            echo "| App Runner operation | \`${op_id}\` |"
            echo "| Health | [\`${health_url}\`](${health_url}) reports \`commit: ${TARGET_SHA}\` |"
            echo "| Rollback | re-run this workflow with \`sha\` set to a known-good commit |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # The assertion above uses App Runner's DEFAULT domain, which is the
      # right primary check: it is the service itself, with nothing in front.
      # But diners reach `https://api.<domain>`, and a broken custom-domain
      # association passes that check green. So: a second look through the
      # front door, NON-gating — the deploy already succeeded, and failing the
      # job here would only make a DNS problem read as a bad build.
      #
      # The URL is an optional repository variable rather than an SSM read on
      # purpose: `infra/github-oidc.tf` grants this role no `ssm:GetParameter`,
      # by design. A stale variable produces a warning, not a red deploy —
      # the correct blast radius for a check that does not gate.
      # ---------------------------------------------------------------------
      - name: Check the custom domain serves the same commit (non-gating)
        if: ${{ vars.PUBLIC_API_URL != '' }}
        # Belt to the script's braces: an unforeseen non-zero here must not
        # turn a DNS check into a red deploy.
        continue-on-error: true
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          url="${PUBLIC_API_URL%/}/api/health"
          # Three outcomes, kept apart: unreachable; reachable but no `commit`
          # (an image that predates the marker, or a build without the arg);
          # and a commit that is not ours.
          if body="$(curl -fsS --max-time 15 "${url}" 2>/dev/null)"; then
            current="$(printf '%s' "${body}" | jq -r '.commit // "<no commit field>"' 2>/dev/null || echo "<not JSON>")"
          else
            current="<unreachable>"
          fi
          if [ "${current}" = "${TARGET_SHA}" ]; then
            echo "Custom domain ${url} reports commit ${TARGET_SHA}."
            {
              echo ""
              echo "Custom domain [\`${url}\`](${url}) reports \`commit: ${TARGET_SHA}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${url} reports commit '${current}', not '${TARGET_SHA}'."
            echo "::warning::The App Runner default domain IS verified, so the deploy itself is fine;"
            echo "::warning::this is the custom-domain association (infra: dns.tf / backend-service.tf)"
            echo "::warning::or a stale PUBLIC_API_URL variable. Diners use this host — look at it."
            {
              echo ""
              echo ":warning: Custom domain [\`${url}\`](${url}) reports \`${current}\`, not this commit — see the run annotations."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Before this plan, a stale site was invisible. Without this, a FAILED deploy
  # would be invisible too — the same defect, moved.
  #
  # A separate JOB rather than an `if: failure()` step, because the cases worth
  # alerting on are exactly the ones a step inside `deploy` cannot see: `resolve`
  # or `test` failing (so `deploy` never runs), and `deploy` being CANCELLED —
  # which is what `timeout-minutes` produces, and `failure()` is false for a
  # cancellation. A 45-minute timeout is precisely "a deploy is in flight and
  # nobody is watching".
  # ---------------------------------------------------------------------------
  alert:
    name: Report a failed deploy
    needs: [resolve, test, deploy]
    if: >-
      always() &&
      (needs.resolve.result == 'failure' ||
       needs.test.result == 'failure' ||
       needs.deploy.result == 'failure' ||
       needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail

          if [ "${DEPLOY_RESULT}" = "cancelled" ]; then
            # The dangerous one: the push may already have happened, so App
            # Runner may be mid-deployment — migrations included — with nothing
            # left watching it.
            headline="Portofino backend deploy CANCELLED (possibly mid-flight)"
            detail="The deploy job was cancelled or timed out. If the image was already pushed, App Runner may be applying it RIGHT NOW, migrations included. Check the App Runner console before doing anything else."
          else
            headline="Portofino backend deploy FAILED"
            detail="resolve=${RESOLVE_RESULT} test=${TEST_RESULT} deploy=${DEPLOY_RESULT}. Read the 'Wait for the deployment' step before assuming the live service is unchanged."
          fi

          text="${headline} for ${TARGET_SHA:-<unresolved>} — ${RUN_URL}"
          {
            echo "### :x: ${headline}"
            echo ""
            echo "Commit \`${TARGET_SHA:-<unresolved>}\`."
            echo ""
            echo "${detail}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${WEBHOOK:-}" ]; then
            if curl -fsS -X POST -H 'Content-Type: application/json' \
                 --data "$(jq -nc --arg t "${text}" '{text: $t}')" "${WEBHOOK}"; then
              echo "Alert delivered."
            else
              echo "::warning::Alert webhook POST failed; the run log is the only notice."
            fi
          else
            echo "::warning::No DEPLOY_ALERT_WEBHOOK secret is set, so this failure notifies nobody."
            echo "::warning::Set one (Slack/Teams incoming webhook) to close that gap."
          fi
