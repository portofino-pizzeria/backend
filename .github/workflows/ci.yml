# Backend CI — typecheck + the full test suite against a real Postgres.
#
# The suite is integration-shaped on purpose: pricing, availability and allergen
# resolution are all resolved in the database, so `vitest.config.ts`'s
# `globalSetup` refuses to run without one rather than silently skipping. A
# `services:` container is therefore not an optimisation here — without it this
# workflow cannot go green at all.
#
# Also callable (`workflow_call`) so `deploy.yml` can gate on exactly this, at a
# ref it chooses, rather than on a copy of it that could drift.

name: CI

on:
  # `deploy.yml` also calls this workflow on every master push, so a master push
  # runs it twice. That duplication is deliberate: it keeps a CI status on master
  # that is attributable to this workflow alone, and so survives the deploy
  # workflow being disabled, or failing before its tests for a reason unrelated
  # to the code.
  push:
    branches:
      - master
      # coord's merge-train candidate refs. coord lands a PR that is behind
      # master by pushing a rebased candidate here and waiting for THIS
      # workflow to go green on it; with only `master` listed, no run ever
      # started, coord read "candidate CI never STARTED" and terminally failed
      # the proposal after 10 requeues (backend#21, 2026-09-21). An
      # up-to-date PR head lands by fast-forward on its own PR CI and never
      # needed these. `merge-candidate-spec` is the speculative lane.
      - 'merge-candidate/**'
      - 'merge-candidate-batch/**'
      - 'merge-candidate-spec/**'
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to check out. Defaults to the caller's own commit; the deploy
          workflow passes the sha it is about to ship, so a rollback dispatch
          tests the code being rolled back to and not whatever is on master.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keyed on the ref being tested, so a rollback dispatch that reuses this
  # workflow does not cancel the CI run for master.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major version as docker-compose.yml (local dev) and as the
        # managed Aurora Postgres the deployed service runs on.
        image: postgres:16
        env:
          # `globalSetup` connects to the `postgres` maintenance database on
          # this server to CREATE the test database, so this role has to be the
          # image's superuser — which POSTGRES_USER is.
          POSTGRES_USER: portofino
          POSTGRES_PASSWORD: portofino
          POSTGRES_DB: portofino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portofino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Read by `test/support/database.ts`. The name must contain "test": the
      # fixture DROPs and recreates the public schema on every run and refuses
      # any database that does not look like a throwaway one.
      #
      # No `sslmode` — `resolveSsl()` treats a localhost URL as plaintext, which
      # is what the service container speaks.
      TEST_DATABASE_URL: postgres://portofino:portofino@localhost:5432/portofino_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime image (Dockerfile: node:22-slim), so a syntax or
          # API difference cannot pass here and fail in the container.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run typecheck` does not EMIT, so until this step existed nothing
      # in CI ever produced `dist/`. The only build was `docker build` in
      # deploy.yml — which the retag path skips entirely — so a broken emit
      # (a `rootDir`/`outDir` change, a moved file) could reach production as
      # `Cannot find module '/app/dist/…'` with every check green. That matters
      # for more than `node dist/index.js`: `npm run db:reseed:dist`, the one
      # reseed spelling that runs inside the container, is a path into `dist/`
      # too.
      - name: Build (proves the emit, which typecheck does not)
        run: npm run build

      # No separate migration step, deliberately. `test/global-setup.ts` creates
      # the database, drops the `public` and `drizzle` schemas, and re-applies
      # `drizzle/*.sql` from zero on every run. A `npm run db:migrate` here
      # would target DATABASE_URL (the *dev* database) and be dropped moments
      # later anyway — so it would be a step that looks like a gate and is not.
      # If a migration in `drizzle/` is broken, this step is where it fails.
      - name: Test (creates + migrates the test database, then runs the suite)
        run: npm test
